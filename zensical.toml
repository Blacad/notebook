[project]
site_name = "Blacad Docs"
site_description = "Blacad 的个人文档笔记"
site_author = "Blacad"
site_url = "https://Blacad.github.io/blog/"
repo_name = "Blacad/blog"
repo_url = "https://github.com/Blacad/blog"
edit_uri = "edit/main/docs/"
copyright = "Copyright &copy; 2026 Blacad"
use_directory_urls = false

extra_css = [
  "css/counter.css",
  "css/custom.css",
  "css/home.css",
  "css/header.css",
  "css/sidebar.css",
  "css/statistics.css",
  "https://unpkg.com/katex@0/dist/katex.min.css",
  "https://gcore.jsdelivr.net/npm/lxgw-wenkai-screen-webfont@1.1.0/style.css",
]

extra_javascript = [
  "js/anchor.js",
  "js/home.js",
  "js/katex.js",
  "js/toc.js",
  "js/statistics.js",
  "https://unpkg.com/katex@0/dist/katex.min.js",
  "https://unpkg.com/katex@0/dist/contrib/auto-render.min.js",
]

[project.markdown_extensions.toc]
permalink = true
toc_depth = 4

[project.markdown_extensions.attr_list]
[project.markdown_extensions.pymdownx.emoji]
[project.markdown_extensions.admonition]
[project.markdown_extensions.pymdownx.details]

[project.markdown_extensions.pymdownx.highlight]
use_pygments = true

[project.markdown_extensions.pymdownx.inlinehilite]

[project.markdown_extensions.pymdownx.superfences]
custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" },
]

[project.markdown_extensions.pymdownx.tabbed]
alternate_style = true

[project.markdown_extensions.footnotes]
[project.markdown_extensions.pymdownx.caret]
[project.markdown_extensions.pymdownx.keys]
[project.markdown_extensions.pymdownx.mark]
[project.markdown_extensions.pymdownx.tilde]

[project.markdown_extensions.pymdownx.arithmatex]
generic = true

[project.markdown_extensions.def_list]

[project.markdown_extensions.pymdownx.tasklist]
custom_checkbox = true

[project.markdown_extensions.abbr]
[project.markdown_extensions.pymdownx.snippets]
[project.markdown_extensions.md_in_html]
[project.markdown_extensions.pymdownx.blocks.caption]

[project.theme]
custom_dir = "overrides"
favicon = "images/photo.JPG"
language = "zh"
features = [
  "announce.dismiss",
  "content.action.edit",
  "content.action.view",
  "content.code.annotate",
  "content.code.copy",
  "content.code.select",
  "content.footnote.tooltips",
  "content.tabs.link",
  "content.tooltips",
  "navigation.footer",
  "navigation.instant",
  "navigation.instant.prefetch",
  "navigation.instant.progress",
  "navigation.path",
  "navigation.tabs",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
  "toc.follow",
]

[project.theme.icon]
logo = "material/notebook"

[[project.theme.palette]]
media = "(prefers-color-scheme)"
toggle.icon = "lucide/sun-moon"
toggle.name = "Switch to light mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"
accent = "blue"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "Switch to light mode"
accent = "teal"

[project.theme.icon.admonition]
success = "octicons/thumbsup-16"

[[project.extra.social]]
icon = "fontawesome/brands/github"
link = "https://github.com/Blacad"

[project.plugins.awesome-nav]
